slug: libresharp-wolverinefx-react
name: WolverineFx + React (LibreSharp)
url: https://www.nuget.org/packages/LibreSharp.Templates.WolverineFxReact
repo: https://github.com/LibreSharp/WolverineFx-React
license: MIT
openSource: true
status: active
statusNote: Maintained by LibreSharp. First release (v0.1.0) on 26 November 2026; latest is v0.4.0 (27 November 2026), which added organisations. Stripe billing is planned for v0.4.1.
dotnet: .NET 11
frontend: [React (Vite, TypeScript, Tailwind)]
database: [PostgreSQL (Marten or EF Core)]
install: |
  dotnet new install LibreSharp.Templates.WolverineFxReact
  dotnet new wolverine-react -n MyApp --Persistence efcore --Auth saas
summary: A Wolverine backend and a React front end in one deployable ASP.NET Core host. It covers the jobs often given to MediatR and MassTransit (in-process messaging, a message bus and a transactional outbox) using only free, open source packages. Optional accounts and organisations (--Auth identity or saas) make it a free SaaS starter; billing is not there yet.
features:
  auth:
    status: yes
    note: "Optional (--Auth identity or saas): ASP.NET Core Identity with JWT and rotating refresh tokens, email confirmation, lockout, roles, Google/GitHub sign-in and passkeys"
  multiTenancy:
    status: yes
    note: "Optional (--Auth saas): organisations as Wolverine tenants, kept apart by Marten's conjoined tenancy or an EF Core query filter; Owner, Admin and Member roles, email invitations and a switcher"
  billing:
    status: no
    note: "Stripe subscriptions are planned for v0.4.1"
  adminUi:
    status: partial
    note: "With accounts: an admin page to search users, change roles, lock accounts and invite people. No back office for organisations or subscriptions yet"
  email:
    status: yes
    note: "With accounts: MailKit over SMTP, sent through the Wolverine outbox; Mailpit catches emails in development"
  backgroundJobs:
    status: yes
    note: "Wolverine durable local queues and scheduled messages with a transactional outbox; messages are handled in the background and survive restarts"
  deploy:
    status: yes
    note: "Container publishing and a production Docker Compose with PostgreSQL and Caddy (automatic HTTPS), with a guide for a small VPS. Pre-generated Wolverine code, health checks and OpenTelemetry"
  tests:
    status: yes
    note: "xUnit, Alba and Testcontainers against a real Postgres, Vitest client tests and Playwright end-to-end tests. CI builds and tests all 12 option combinations"
notes:
  - "Also includes event sourcing (with Marten), FluentValidation, real-time updates with SignalR, React Router with pre-rendered public pages, TanStack Query and a typed API client generated from OpenAPI."
  - "v0.4.0 replaced --Identity true|false with --Auth none|identity|saas. With accounts, production needs App__ClientUrl set to the app's public address."
  - "Generated apps get a docs folder with how-to guides, and an AGENTS.md for AI coding assistants."
  - "Every dependency is MIT, Apache-2.0 or the PostgreSQL licence."
  - "Maintained by LibreSharp, the project behind this site."
sources:
