slug: npoi
name: NPOI
nuget: [NPOI]
repo: https://github.com/nissl-lab/npoi
category: maintenance-fee
oldLicense: Apache-2.0
newModel: Source stays Apache-2.0. Official binaries from 2.8.0 include an Open Source Maintenance Fee EULA.
lastFreeVersion: 2.7.6
firstPaidVersion: 2.8.0
changed: 2026-04
freeTier: Organisations with under US$10,000 annual gross revenue are exempt, and so are those already paying the maintainers for support. The fee is paid through GitHub Sponsors.
summary: NPOI, a .NET port of Apache POI for Excel and Word files, is still Apache-2.0, but revenue-generating users of the official packages from 2.8.0 are asked to pay a maintenance fee.
alternatives:
  - name: ClosedXML
    kind: replacement
    url: https://github.com/ClosedXML/ClosedXML
    nuget: ClosedXML
    license: MIT
    note: Friendly API for creating and editing .xlsx files.
  - name: MiniExcel
    kind: replacement
    url: https://github.com/mini-software/MiniExcel
    nuget: MiniExcel
    license: Apache-2.0
    note: Fast, low-memory reading and writing of Excel files.
  - name: Open XML SDK
    kind: replacement
    url: https://github.com/dotnet/Open-XML-SDK
    nuget: DocumentFormat.OpenXml
    license: MIT
    note: Microsoft's low-level library for Office files (Excel, Word, PowerPoint).
  - name: ExcelDataReader
    kind: replacement
    url: https://github.com/ExcelDataReader/ExcelDataReader
    nuget: ExcelDataReader
    license: MIT
    note: Read-only, but also reads old .xls files.
  - name: Pay the fee
    kind: pay
    note: The fee supports the maintainers and keeps NPOI open source.
sources:
  - title: NPOI 2.8.0 licence on NuGet
    url: https://www.nuget.org/packages/NPOI/2.8.0/License
  - title: Open Source Maintenance Fee project list
    url: https://opensourcemaintenancefee.org/consumers/list/
checked: 2026-11-26
